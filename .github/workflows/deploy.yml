name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende nicht abbrechen.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # voller git-Verlauf für <lastmod> in der Sitemap (SEO-/KI-Audit S8)
      - name: Build mit Astro
        uses: withastro/action@v3
        # withastro/action installiert Abhängigkeiten, baut nach ./dist
        # und lädt das Ergebnis als Pages-Artefakt hoch.
        with:
          # Astro 7 benötigt Node >= 22.12 (Action-Default ist 20).
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy nach GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # SEO-/KI-Audit G4: Änderungen per IndexNow an Bing melden (ChatGPT/Copilot nutzen den Bing-Index).
      # Wirkt erst nach dem Umzug auf die eigene Domain; auf github.io meldet das Skript nichts.
      - name: Checkout (nur Skripte)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: IndexNow melden
        continue-on-error: true
        run: node scripts/indexnow.mjs "${{ steps.deployment.outputs.page_url }}"
